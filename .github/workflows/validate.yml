name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-test.txt
      - run: python -m compileall -q custom_components/halarm
      - run: node --check custom_components/halarm/frontend/halarm.js
      - run: python -m unittest discover -s tests -v
      - run: PYTHONPATH=. python tests/runtime_check.py
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_check.py
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate custom HACS repository
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          # Brands registration is for inclusion in the default catalogue.
          ignore: brands
